<p>
  此列表包含配置的更新站点所发布的所有与当前已安装组件相关的警告。这些警告通常与安全相关。已发布但与当前已安装组件无关的警告（无论是由于受影响的组件未安装，还是安装了不受影响的版本）不会在此处显示。
</p>
<p>
  默认情况下，选中的条目为<em>激活</em>状态，即它们会显示在插件管理器中以及管理监视器中。您可以取消选中条目以将其隐藏。如果您已评估了特定警告并确信它不适用于您的环境或配置，且继续使用指定组件不构成安全问题，则此操作可能很有用。
</p>
<p>
  请注意，只能禁用特定的警告；无法禁用关于某个组件的所有警告。如果您希望完全禁用警告显示，则可以在<em>系统配置</em>中禁用管理监视器。
</p>
