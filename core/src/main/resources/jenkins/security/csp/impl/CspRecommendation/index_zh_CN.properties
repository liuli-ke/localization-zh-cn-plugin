paragraph1 = \u5185\u5bb9\u5b89\u5168\u7b56\u7565(CSP)\u662f\u4e00\u79cd\u5b89\u5168\u673a\u5236\uff0c\u53ef\u4ee5\u51cf\u5c11\u6216\u6d88\u9664\u8de8\u7ad9\u811a\u672c\uff08XSS\uff09\u7b49 Web \u5b89\u5168\u6f0f\u6d1e\u7684\u5f71\u54cd\u3002
paragraph2 = \u5927\u591a\u6570\u6d41\u884c\u7684 Jenkins \u63d2\u4ef6\u4e0e Jenkins \u7684\u9ed8\u8ba4\u89c4\u5219\u96c6\u517c\u5bb9\uff0c\u4f46\u5f53\u524d\u5df2\u5b89\u88c5\u7684\u63d2\u4ef6\u5e76\u975e\u5168\u90e8\u517c\u5bb9\u3002\u5982\u679c\u9009\u62e9\u5f3a\u5236\u6267\u884c\u5185\u5bb9\u5b89\u5168\u7b56\u7565\u5e76\u5bfc\u81f4 Jenkins UI \u51fa\u73b0\u95ee\u9898\uff0c\u60a8\u53ef\u4ee5\u901a\u8fc7\u5c06 Java \u7cfb\u7edf\u5c5e\u6027 <code>jenkins.security.csp.CspHeader.headerName</code> \u8bbe\u7f6e\u4e3a <code>Content-Security-Policy-Report-Only</code> \u6765\u91cd\u65b0\u542f\u52a8 Jenkins\uff0c\u4ece\u800c\u518d\u6b21\u7981\u7528\u4fdd\u62a4\u3002
paragraph3 = \u6709\u5173\u786e\u5b9a\u60a8\u5f53\u524d\u8bbe\u7f6e\u662f\u5426\u4e0e\u5185\u5bb9\u5b89\u5168\u7b56\u7565\u5f3a\u5236\u6267\u884c\u517c\u5bb9\u7684\u8d44\u6e90\uff0c\u8bf7\u8bbf\u95ee <a href="https://www.jenkins.io/redirect/csp-compatibility" target="_blank">\u6587\u6863\u7f51\u7ad9</a>\u3002
Enabling\ Content\ Security\ Policy\ configuration=\u6b63\u5728\u542f\u7528\u5185\u5bb9\u5b89\u5168\u7b56\u7565\u914d\u7f6e
Go\ to\ configuration=\u524d\u5f80\u914d\u7f6e
