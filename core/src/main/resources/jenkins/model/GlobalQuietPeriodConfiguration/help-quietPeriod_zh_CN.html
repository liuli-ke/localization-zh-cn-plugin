<div>
  设置后，新排入的构建会等待指定的秒数过后才会真正开始执行。用途有：
  <ul>
    <li>
      把多次 CVS 变更收敛成一个（某些产生 CVS 变更记录邮件的脚本在跨目录提交时会连续发送邮件）。
    </li>
    <li>
      如果您的开发风格是将不同逻辑单元的变更分次提交，将静候时间设长一点可以避免 Jenkins 因为过早构建而报告错误。
    </li>
    <li>
      调节构建。如果您的 Jenkins 构建太多，一直忙不过来，将静候时间设长一点可以减少构建次数。
    </li>
  </ul>
  如果没有在项目中明确设置，则会使用此系统默认值。
</div>
