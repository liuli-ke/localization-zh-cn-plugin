blurb=\u5728\u6B64\u6A21\u5F0F\u4E0B\uFF0CJenkins \u5C06\u5728\u8BA1\u5212\u7684\u65F6\u95F4\u5C06\u6B64\u4EE3\u7406\u4E0A\u7EBF\uFF0C\u5E76\u4FDD\u6301\u5728\u7EBF\u4E00\u6BB5\u6307\u5B9A\u7684\u65F6\u95F4\u3002<br/>\u5982\u679C\u4EE3\u7406\u5728\u8BA1\u5212\u4E0A\u7EBF\u671F\u95F4\u79BB\u7EBF\uFF0CJenkins \u5C06\u5B9A\u671F\u5C1D\u8BD5\u91CD\u542F\u5B83\u3002<br/>\u5F53\u6B64\u4EE3\u7406\u5728\u7EBF\u65F6\u95F4\u8FBE\u5230<i>\u8BA1\u5212\u7684\u8FD0\u884C\u65F6\u95F4</i>\u5B57\u6BB5\u4E2D\u6307\u5B9A\u7684\u5206\u949F\u540E\uFF0C\u5B83\u5C06\u88AB\u4E0B\u7EBF\u3002<br/>\u5982\u679C\u9009\u4E2D<i>\u5F53\u6709\u4EFB\u52A1\u8FD0\u884C\u65F6\u4FDD\u6301\u5728\u7EBF</i>\uFF0C\u5E76\u4E14\u4EE3\u7406\u8BA1\u5212\u88AB\u4E0B\u7EBF\uFF0CJenkins \u5C06\u7B49\u5F85\u4EFB\u4F55\u53EF\u80FD\u6B63\u5728\u8FDB\u884C\u7684\u6784\u5EFA\u5B8C\u6210\u3002
