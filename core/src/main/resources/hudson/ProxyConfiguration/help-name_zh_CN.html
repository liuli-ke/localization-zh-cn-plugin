<div>
  如果您的 Jenkins 在防火墙后面，不能直接连接到 Internet，而且服务器 JVM
  也没有特别设置（
  <a
          href="https://docs.oracle.com/javase/8/docs/technotes/guides/net/properties.html"
  >
    参考 JDK 的《Networking Properties》了解详情
  </a>
  ）。 可以在这里指定 HTTP 代理服务器名称，让 Jenkins 帮您安装插件。
  请注意，Jenkins 使用 HTTPS 协议从更新中心下载插件。

  <p>
    您在这里输入的值会被设置为
    <code>http.proxyHost</code>
    系统属性。 不填任何值代表不设置此项属性，Jenkins 会尝试直接连接到主机。
  </p>

  <p>如果您不确定该如何填写，可以参考浏览器的代理服务器设置。</p>
</div>
