<div>
  Jenkins 在此节点上可以执行的并发构建的最大数量。
  <p>
    一个合理的起始值是机器上的 CPU 核心数。设置更高的值会使每个构建耗时更长，但可能会提高整体吞吐量。例如，一个构建可能是 CPU 密集型的，而同时运行的另一个构建可能是 I/O 密集型的，因此第二个构建可以利用当时的空闲 I/O 能力。
  <p>
    代理（非内置节点的节点）必须至少有一个执行器。要临时阻止任何构建在代理上执行，请使用代理页面上的 <i>将此节点暂时离线</i> 按钮。
  <p>
    对于内置节点，将执行器数量设置为零可防止其在控制器本地执行构建。
    <i>注意：</i> 内置节点始终能够运行轻量级任务，包括 Pipeline 的顶层任务。
</div>
