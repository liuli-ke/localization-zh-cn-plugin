<div>
  <p>
    启用后，如果最后一次成功构建和最后一次稳定构建匹配已配置的构建丢弃规则，Jenkins 允许将其删除。
  </p>

  <p>
    默认情况下，Jenkins 会保留最近的成功构建和稳定构建，即使它们超过了配置的保留期限。启用此选项将覆盖该行为。
  </p>

  <p>
    <b>示例：</b>
    <br />
    如果构建被配置为在 7 天后删除，而最近的成功构建是 30 天前构建的，通常该构建会被保留。启用此选项后，该构建也会被删除。
  </p>

  <p>此选项也可在流水线中使用，如下所示：</p>

  <pre>
options {
    buildDiscarder logRotator(removeLastBuild: true)
}
  </pre>
</div>
