<div>
  <p>
    Jenkins 会在任务、视图或构建等对象上显示用户提供的描述信息。标记格式化器控制这些描述信息的渲染方式。
  </p>
  <p>
    “纯文本”是默认的格式化器，它会按输入内容原样渲染描述信息。
  </p>
  <p>
    插件可以提供支持 HTML 或其他标记语言的额外标记格式化器。
  </p>
  <p>
    <strong>注意：</strong>
    部分描述信息可能来自不可预期的来源。例如：
  </p>
  <ul>
    <li>任何拥有 Jenkins 账户的用户都可以设置自己的描述信息</li>
    <li>
      流水线以及其他任务类型的构建步骤可能会配置为设置当前构建的描述信息
    </li>
  </ul>
  <p>
    使用按原样将用户输入渲染为 HTML 的标记格式化器可能会导致
    <a
            href="https://en.wikipedia.org/wiki/Cross-site_scripting"
            target="_blank"
            rel="noopener noreferrer"
    >
      跨站脚本攻击
    </a>。
  </p>
</div>
