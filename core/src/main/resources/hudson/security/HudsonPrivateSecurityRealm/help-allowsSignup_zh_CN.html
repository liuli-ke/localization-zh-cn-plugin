<div>
  此选项允许用户通过页面右上角的“注册”链接自行创建账户。
  <strong>
    请确保不要向已认证用户授予过高的权限，因为网络上的任何人都可以获得这些权限。
  </strong>
  <p>
    如果未选中此复选框，则需要管理员角色用户来创建账户。
  </p>

  <p>
    默认情况下，如果用户自行创建账户，Jenkins 不会使用验证码验证。如果您希望启用验证码验证，请安装支持验证码的插件，例如 Jenkins
    <a href="https://plugins.jenkins.io/jcaptcha-plugin">JCaptcha 插件</a>。
  </p>
</div>
