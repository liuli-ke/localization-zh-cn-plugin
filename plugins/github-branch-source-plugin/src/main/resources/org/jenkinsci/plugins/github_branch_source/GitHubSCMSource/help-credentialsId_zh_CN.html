<div>
    <p>
        用于<strong>扫描</strong>分支 和 Pull Request、<strong>签出</strong>源码以及<strong>标记</strong>提交状态的凭证。
    </p>
    <p>
        请注意，仅支持 <strong>“用户名 + 密码”</strong> 类型的凭证。其他类型的现有凭证将被过滤掉。这是因为 Jenkins 使用的是 GitHub API，而该 API 不支持其他认证方式。
    </p>
    <p>
        如果未提供凭证，则仅会扫描公共仓库，且不会在 GitHub 上设置提交状态。
    </p>
    <p>
        如果您的组织包含私有仓库，则需要指定具有这些仓库访问权限的用户的凭证。具体做法是创建一个“用户名 + 密码”凭证，其中密码为 <a href="https://github.com/settings/tokens">GitHub 个人访问令牌</a>。所需的范围是 “repo”。
    </p>
</div>
