<div>
    这些行为控制着从 GitHub 服务器中发现的内容。行为分为以下几类：
    <dl>
        <dt>仓库</dt>
        <dd>这些行为决定哪些仓库会被发现。只有至少包含一个已发现分支或拉取请求的仓库才能被发现。</dd>
        <dt>仓库内</dt>
        <dd>这些行为决定在每个仓库内发现什么。<strong>如果您没有配置至少一个发现行为，则不会发现任何内容！</strong></dd>
        <dt>常规</dt>
        <dd>这些行为影响每个已发现分支或拉取请求的配置。</dd>
    </dl>
</div>
