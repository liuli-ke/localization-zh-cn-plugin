<div>
    确定要发现哪些分支。
    <dl>
        <dt>排除同时作为拉取请求提交的分支</dt>
        <dd>
            如果您正在发现源拉取请求，您可能不希望同时为这些拉取请求的源分支构建。
        </dd>
        <dt>仅发现同时作为拉取请求提交的分支</dt>
        <dd>
            类似于发现源拉取请求，但发现的是分支而不是拉取请求。
            这意味着 <code>env.GIT_BRANCH</code> 将被设置为分支名称，而不是 <code>PR-#</code>。
            同时，这些构建的状态通知将仅应用于提交，而不会应用于拉取请求。
        </dd>
        <dt>所有分支</dt>
        <dd>
            忽略分支是否同时作为拉取请求提交，而是发现源仓库中的所有分支。
        </dd>
    </dl>
</div>
