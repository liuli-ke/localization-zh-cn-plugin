<div>
    确定拉取请求的发现方式：
    <dl>
        <dt>将拉取请求与当前目标分支修订版合并</dt>
        <dd>每次扫描发现每个拉取请求一次，发现的修订版对应与目标分支当前修订版合并后的结果。
            请注意，向目标分支推送将触发新的拉取请求构建。
        </dd>
        <dt>当前拉取请求修订版</dt>
        <dd>每次扫描发现每个拉取请求一次，发现的修订版对应拉取请求头部修订版，不进行合并。
        </dd>
        <dt>同时检查当前拉取请求修订版以及与当前目标分支修订版合并后的结果</dt>
        <dd>每个拉取请求被发现两次。第一次发现的修订版对应每次扫描中与目标分支当前修订版合并的结果。
            第二次并行发现的修订版对应拉取请求头部修订版，不进行合并。
        </dd>
    </dl>
</div>
