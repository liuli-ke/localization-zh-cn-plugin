<div>
  <p>
    GitLab 插件用于访问 GitLab API 的 API 令牌。
  </p>
  <p>
    如果提供了 <a href="https://docs.gitlab.com/ee/user/profile/personal_access_tokens.html#create-a-personal-access-token">GitLab 个人访问令牌</a>，Jenkins 将以生成该个人访问令牌的用户身份访问 GitLab。
    如果提供了 <a href="https://docs.gitlab.com/ee/user/project/settings/project_access_tokens.html#create-a-project-access-token">GitLab 项目访问令牌</a>，Jenkins 将在项目级别访问 GitLab。
    如果提供了 <a href="https://docs.gitlab.com/ee/user/group/settings/group_access_tokens.html#create-a-group-access-token-using-ui">GitLab 群组访问令牌</a>，Jenkins 将在群组级别访问 GitLab，并可访问该群组中的所有项目。
  </p>
  <p>
    为访问令牌分配 <code>API</code> 作用域，以便其可以使用 GitLab API。
  </p>
</div>
