<div>
    您可以在您的 GitHub 账户设置中创建自己的<a href="https://github.com/settings/tokens/new">个人访问令牌</a>。
    <br/>
    令牌应注册以下作用域：
    <ul>
        <li><b>admin:repo_hook</b> - 用于管理钩子（读取、写入和删除旧钩子）</li>
        <li><b>repo</b> - 用于查看私有仓库</li>
        <li><b>repo:status</b> - 用于操作提交状态</li>
    </ul>

    <br/>
    在 Jenkins 中，创建由
    <a href="https://wiki.jenkins-ci.org/display/JENKINS/Plain+Credentials+Plugin">Plain Credentials Plugin</a> 提供的«Secret Text»类型的凭据。<br/>

    <p>
        <b>警告！</b> 更改自定义 GitHub URL 时，凭据会被过滤。<br/>
    </p>

    <p>
        如果您已有 GitHub 登录名和密码，可以借助«<b>管理其他 GitHub 操作</b>»自动将其转换为令牌。
    </p>
</div>
