<div>
    <p>
        Jenkins 将使用 <tt>$JENKINS_HOME</tt> 中这么多空间（以兆字节为单位）来缓存从 GitHub API 调用检索到的数据。
        缓存将有助于提高性能，避免不必要的数据传输，并且通过使用<a href="https://developer.github.com/v3/#conditional-requests">条件 GET</a> 调用，它还能降低触发 <a href="https://developer.github.com/v3/#rate-limiting">API 速率限制</a>的可能性。
    </p>
    <p>
        如果万一缓存导致问题，请将其设置为 <tt>0</tt> 以完全禁用缓存。
    </p>
</div>
