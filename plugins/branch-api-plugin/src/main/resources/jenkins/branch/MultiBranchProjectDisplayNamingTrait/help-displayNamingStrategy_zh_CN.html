<div>
  不同的策略：
  <ul>
    <li>
      <p>
        <strong>任务显示名称（回退到名称）：</strong>
        <br>
        使用分支源插件提供的拉取请求显示名称，而非原始名称。
        <br>
        配置即代码（Configuration as Code）的值：<code>OBJECT_DISPLAY_NAME</code>
      </p>
    </li>
    <li>
      <p>
        <strong>名称及显示名称（如果可用）：</strong>
        <br>
        将原始名称和分支源插件的显示名称拼接在一起。
        <br>
        配置即代码（Configuration as Code）的值：<code>RAW_AND_OBJECT_DISPLAY_NAME</code>
      </p>
    </li>
    <li>
      <p>
        <strong>仅使用简单名称：</strong>
        <br>
        只显示原始名称。
        <br>
        配置即代码（Configuration as Code）的值：<code>RAW</code>
      </p>
    </li>
  </ul>
</div>
