CLI.Usage=Jenkins CLI\n\
  \u7528\u6cd5: java -jar jenkins-cli.jar [-s URL] \u547d\u4ee4 [\u9009\u9879...] \u53c2\u6570...\n\
  \u9009\u9879:\n\
  \ -s URL              : \u670d\u52a1\u5668 URL\uff08\u9ed8\u8ba4\u4f7f\u7528 JENKINS_URL \u73af\u5883\u53d8\u91cf\uff09\n\
  \ -webSocket          : \u4f7f\u7528 WebSocket \u8fde\u63a5\uff08\u9ed8\u8ba4\uff1b\u9002\u7528\u4e8e\u5927\u591a\u6570\u53cd\u5411\u4ee3\u7406\uff1b\u9700\u8981 Jetty\uff09\n\
  \ -http               : \u4f7f\u7528\u4e00\u5bf9 HTTP%28s%29 \u8fde\u63a5\u800c\u975e WebSocket\n\
  \ -ssh                : \u4f7f\u7528 SSH \u534f\u8bae\u800c\u975e WebSocket\uff08\u9700\u8981 -user\uff1b\u670d\u52a1\u5668\u5fc5\u987b\u5f00\u653e SSH \u7aef\u53e3\uff09\n\
  \ -i KEY              : \u7528\u4e8e\u8ba4\u8bc1\u7684 SSH \u79c1\u94a5\u6587\u4ef6\uff08\u4e0e -ssh \u914d\u5408\u4f7f\u7528\uff09\n\
  \ -noCertificateCheck : \u5b8c\u5168\u7ed5\u8fc7 HTTPS \u8bc1\u4e66\u68c0\u67e5\u3002\u8bf7\u8c28\u614e\u4f7f\u7528\n\
  \ -noKeyAuth          : \u4e0d\u5c1d\u8bd5\u52a0\u8f7d SSH \u8ba4\u8bc1\u79c1\u94a5\u3002\u4e0e -i \u51b2\u7a81\n\
  \ -user               : \u6307\u5b9a\u7528\u6237\u540d\uff08\u4e0e -ssh \u914d\u5408\u4f7f\u7528\uff1b\u5fc5\u987b\u5df2\u6ce8\u518c\u516c\u94a5\uff09\n\
  \ -strictHostKey      : \u8981\u6c42\u4e25\u683c\u7684\u4e3b\u673a\u5bc6\u94a5\u68c0\u67e5\uff08\u4e0e -ssh \u914d\u5408\u4f7f\u7528\uff09\n\
  \ -logger FINE        : \u542f\u7528\u5ba2\u6237\u7aef\u7684\u8be6\u7ec6\u65e5\u5fd7\u8bb0\u5f55\n\
  \ -auth [ USER:SECRET | @FILE ] : \u6307\u5b9a\u7528\u6237\u540d\u53ca\u5bc6\u7801\u6216 API \u4ee4\u724c\uff08\u6216\u4ece\u6587\u4ef6\u4e2d\u52a0\u8f7d\u4e24\u8005\uff09\uff1b\n\
  \                                 \u7528\u4e8e -http \u6a21\u5f0f\u3002\n\
  \                                 \u5efa\u8bae\u901a\u8fc7\u6587\u4ef6\u4f20\u9012\u51ed\u8bc1\u3002\n\
  \                                 \u6709\u5173\u66f4\u591a\u4fe1\u606f\u548c\u9009\u9879\uff0c\u8bf7\u53c2\u89c1 https://www.jenkins.io/redirect/cli-http-connection-mode\n\
  \ -bearer [ TOKEN | @FILE ]     : \u4f7f\u7528 Bearer \u4ee4\u724c\u8fdb\u884c\u8ba4\u8bc1\uff08\u6216\u4ece\u6587\u4ef6\u52a0\u8f7d\u4ee4\u724c\uff09\uff1b\n\
  \                                 \u7528\u4e8e -http \u6a21\u5f0f\u3002\u4e0e -auth \u4e92\u65a5\u3002\n\
  \                                 \u5efa\u8bae\u901a\u8fc7\u6587\u4ef6\u4f20\u9012\u51ed\u8bc1\u3002\n\
  \n\
  \u53ef\u7528\u547d\u4ee4\u53d6\u51b3\u4e8e\u670d\u52a1\u5668\u3002\u8fd0\u884c ''help'' \u547d\u4ee4\u67e5\u770b\u5217\u8868\u3002

CLI.NoURL=\u672a\u6307\u5b9a -s \u6216 JENKINS_URL \u73af\u5883\u53d8\u91cf\u3002
CLI.NoSuchFileExists=\u6587\u4ef6\u4e0d\u5b58\u5728: {0}
CLI.BadAuth=JENKINS_USER_ID \u548c JENKINS_API_TOKEN \u73af\u5883\u53d8\u91cf\u5e94\u540c\u65f6\u8bbe\u7f6e\u6216\u540c\u65f6\u7559\u7a7a\u3002